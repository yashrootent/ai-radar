name: Collect AI Radar signals

on:
  schedule:
    - cron: "8 2 * * *"      # 02:08 UTC = 7:38 AM IST, ahead of the morning edition
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD), default today UTC"
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_DATE: ${{ github.event.inputs.date }}
        run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data channel-ids.json
          git diff --cached --quiet || git commit -m "data: $(cat data/latest.txt)"
          git push
